<header class="header">
  <div class="logo">
    <img src="/logo.svg" alt="Logo" class="header__logo" />
  </div>

  <div class="header-bar">
    <div class="search-bar" #searchBar>
      <span class="material-symbols-outlined search-bar__icon" (click)="toogleSearch()">
        search
      </span>
      <input
        type="text"
        placeholder="Search task"
        class="search-bar__input"
        [class.open]="isSearchOpen()"
      />
    </div>

    <button class="filters-btn" (click)="openFiltersMenu()">
      <span class="material-symbols-outlined"> filter_list </span>
    </button>

    <button class="add-task-btn" matButton="filled" (click)="openAddTask('80ms', '80ms')">
      <span class="add-task-btn__icon"><span class="material-symbols-outlined"> add </span></span>
      <span class="add-task-btn__text">Add new task</span>
    </button>
  </div>
</header>
