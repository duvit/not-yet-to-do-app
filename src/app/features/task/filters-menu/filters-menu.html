<div class="filters-menu">
  <div class="filters-menu__sort">
    <button class="filters-menu__sort-btn" (click)="openSort()">
      <span class="material-symbols-outlined"> sort </span> Sort By
    </button>
    @if (isSortOpen()) {
    <ul>
      @for (option of sortOptions; track $index) {
      <li class="filters-menu__sort-option" (click)="onSort(option.value, option.direction)">
        {{ option.label }}
        <span class="material-symbols-outlined">
          {{ option.direction === 'asc' ? 'arrow_upward' : 'arrow_downward' }}
        </span>
      </li>
      }
    </ul>
    }
  </div>
  <div class="filters-menu__statistic">statistic</div>
  <div class="filters-menu__chips">chips</div>
</div>
