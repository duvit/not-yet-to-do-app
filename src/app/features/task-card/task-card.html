<article class="task-card">
  <h4 class="task-card__title">{{ task().title }}</h4>

  <div class="task-card__status" #statusBlock>
    <button class="task-card__status-btn" (click)="toggleDropdown()">
      {{ taskStatus() }}
      <span class="task-card__status-arrow">▾</span>
    </button>

    @if (dropdownOpen) {
      <ul class="task-card__status-list">
        @for (status of availableStatuses(); track $index) {
          <li class="task-card__status-item" (click)="changeStatus(status)">
            {{ status }}
          </li>
        }
      </ul>
    }
  </div>

  <p class="task-card__description">{{ task().description }}</p>

  <div class="task-card__actions">
    <button class="task-card__btn task-card__btn-delete" (click)="deleteTask()">Delete</button>
  </div>
</article>
